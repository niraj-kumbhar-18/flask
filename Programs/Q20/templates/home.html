<!DOCTYPE html>
<html>
<head>
<title>Student Management</title>
</head>
<body>
<h2>Student Records</h2>
<a href="/add">Add New Student</a>
<table border="1">
<tr>
<th>ID</th>
<th>Name</th>
<th>Age</th>
<th>Course</th>
</tr>
{% for s in students %}
<tr>
<td>{{ s.id }}</td>
<td>{{ s.name }}</td>
<td>{{ s.age }}</td>
<td>{{ s.course }}</td>
</tr>
{% endfor %}
</table>
</body>
</html>
